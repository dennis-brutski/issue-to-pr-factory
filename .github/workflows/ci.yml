# The same checks the factory runs before every push. A gate goes in only once main passes it (docs/adr/0006).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.test.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: git config --global user.name CI && git config --global user.email ci@example.invalid # the factory needs a git identity
      - run: npm ci --ignore-scripts
      - id: test
        shell: bash # pipefail: a failing test still fails the step
        run: |
          npm test 2>&1 | tee test-output.txt
          echo "branches=$(awk -F'|' '/^ℹ all files +\|/ { gsub(/ /, "", $3); print $3; exit }' test-output.txt)" >> "$GITHUB_OUTPUT"
  # Publishes the branch coverage badge as an SVG, the only commit of the badges branch. The README loads it from
  # GitHub directly: through shields.io's endpoint badge GitHub's image proxy timed out.
  badge:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badge
    steps:
      - shell: bash
        env:
          BRANCHES: ${{ needs.check.outputs.branches }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BRANCHES" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "Branch coverage is not a number: '$BRANCHES'"; exit 1; }
          git init -q -b badges badges && cd badges
          git config user.name CI && git config user.email ci@example.invalid
          curl -fsS --retry 3 -o coverage.svg "https://img.shields.io/badge/branch%20coverage-${BRANCHES}%25-2ebc4e"
          grep -q '<svg' coverage.svg || { echo "shields.io did not return an SVG"; exit 1; }
          git add coverage.svg && git commit -q -m "Branch coverage $BRANCHES%"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
