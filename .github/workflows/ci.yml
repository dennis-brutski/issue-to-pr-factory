# The same checks the factory runs before every push. A gate goes in only once main passes it (docs/adr/0006).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
